<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartNotes - Error</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .error-container {
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #e30000;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #515154;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
        color: #f5f5f7;
      }
      .error-container {
        background-color: #1c1c1e;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      }
      h1 {
        color: #ff3b30;
      }
      p {
        color: #a1a1a6;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>Backend Service Error</h1>
    <p>SmartNotes could not start its local AI backend process. The health check timed out after 30 seconds.</p>
    <p>Please restart the application.</p>
  </div>
</body>
</html>
